  <!-- Background Rounded Shield / Circle with Golden Crest Border -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#bajiBg)" stroke="url(#goldGrad)" stroke-width="3"/>
  <rect x="7" y="7" width="86" height="86" rx="22" fill="none" stroke="#fed7aa" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Grand Chef Hat -->
  <!-- Main Clouds/Pleats of Toque Blanche -->
  <path d="M 28 40 C 24 31 32 20 42 22 C 45 15 55 15 58 22 C 68 20 76 31 72 40 C 76 46 72 52 68 53 L 32 53 C 28 52 24 46 28 40 Z" fill="url(#hatWhite)" stroke="#7c2d12" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Hat Creases -->
  <path d="M 42 23 Q 44 38 41 52" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <path d="M 50 17 Q 50 35 50 52" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <path d="M 58 23 Q 56 38 59 52" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>

  <!-- Gold Hat Band -->
  <rect x="32" y="51" width="36" height="7" rx="2" fill="url(#goldGrad)" stroke="#7c2d12" stroke-width="1.2"/>
  <line x1="41" y1="52" x2="41" y2="57" stroke="#78350f" stroke-width="1"/>
  <line x1="50" y1="52" x2="50" y2="57" stroke="#78350f" stroke-width="1"/>
  <line x1="59" y1="52" x2="59" y2="57" stroke="#78350f" stroke-width="1"/>

  <!-- Authentic Royal Curved Mustache -->
  <path d="M 50 67 C 46 64 38 62 31 65 C 22 68 24 77 30 76 C 38 74 44 80 50 73 C 56 80 62 74 70 76 C 76 77 78 68 69 65 C 62 62 54 64 50 67 Z" fill="#ffffff" stroke="#7c2d12" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Brand Typography -->
  <text x="50" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">BAJIBHAI</text>
