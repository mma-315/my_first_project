<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="royalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Background Shield/Rounded Square with Gold Trim -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#royalBg)" stroke="url(#goldGrad)" stroke-width="3"/>
  <rect x="7" y="7" width="86" height="86" rx="22" fill="none" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Crown Jewels Top -->
  <!-- 5-Point Crown -->
  <path d="M 26 53 L 23 35 L 36 43 L 50 25 L 64 43 L 77 35 L 74 53 Z" fill="url(#goldGrad)" stroke="#7e22ce" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Crown Jewels dots -->
  <circle cx="23" cy="33" r="3" fill="#fde047" stroke="#6b21a8" stroke-width="1"/>
  <circle cx="36" cy="41" r="2.5" fill="#e9d5ff" stroke="#6b21a8" stroke-width="1"/>
  <circle cx="50" cy="23" r="3.5" fill="#fde047" stroke="#6b21a8" stroke-width="1"/>
  <circle cx="64" cy="41" r="2.5" fill="#e9d5ff" stroke="#6b21a8" stroke-width="1"/>
  <circle cx="77" cy="33" r="3" fill="#fde047" stroke="#6b21a8" stroke-width="1"/>

  <!-- Crown Base Band -->
  <rect x="25" y="52" width="50" height="7" rx="2" fill="#ca8a04" stroke="#581c87" stroke-width="1"/>
  <circle cx="33" cy="55.5" r="1.5" fill="#fef08a"/>
  <circle cx="41.5" cy="55.5" r="1.5" fill="#fef08a"/>
  <circle cx="50" cy="55.5" r="2" fill="#ef4444"/>
  <circle cx="58.5" cy="55.5" r="1.5" fill="#fef08a"/>
  <circle cx="67" cy="55.5" r="1.5" fill="#fef08a"/>

  <!-- Brand Typography -->
  <text x="50" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">ROYAL</text>
  <text x="50" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#e9d5ff" text-anchor="middle" letter-spacing="2">EXOTIC</text>
</svg>
